version: '3.9'

# Production-ready Docker Compose for ChengetAi Learn MVP
# Minimal version for initial server launch

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: chengetai-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-chengetai}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_DB: ${DB_NAME:-chengetai}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-chengetai}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chengetai
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Redis Cache
  redis:
    image: redis:7.2-alpine
    container_name: chengetai-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chengetai
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ChengetAi API
  api:
    build:
      context: .
      dockerfile: Dockerfile.production
    container_name: chengetai-api
    restart: always
    environment:
      APP_NAME: chengetai-learn
      APP_ENV: ${APP_ENV:-production}
      APP_PORT: 8080
      DATABASE_URL: postgres://${DB_USER:-chengetai}:${DB_PASSWORD:-changeme}@postgres:5432/${DB_NAME:-chengetai}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - chengetai
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  chengetai:
    driver: bridge
