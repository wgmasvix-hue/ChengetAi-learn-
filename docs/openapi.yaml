openapi: 3.0.3
info:
  title: ChengetAi Learn API
  version: 0.1.0
servers:
  - url: http://localhost:8080
paths:
  /health:
    get:
      summary: Liveness probe
      responses:
        '200':
          description: API is alive
  /ready:
    get:
      summary: Readiness probe
      responses:
        '200':
          description: Services are ready
        '503':
          description: PostgreSQL is unavailable
  /api/v1/version:
    get:
      summary: API version information
      responses:
        '200':
          description: Version payload
  /api/v1/auth/register:
    post:
      summary: Register a learner, teacher, or parent account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, role, first_name, last_name]
              properties:
                email: { type: string, format: email }
                phone: { type: string }
                password: { type: string, format: password }
                role: { type: string, enum: [learner, teacher, parent] }
                first_name: { type: string }
                last_name: { type: string }
                education_level: { type: string }
                grade: { type: string }
                preferred_language: { type: string }
      responses:
        '201':
          description: Registration succeeded
        '400':
          description: Validation failed
        '403':
          description: Forbidden role
        '409':
          description: Email already exists
  /api/v1/auth/login:
    post:
      summary: Log in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        '200':
          description: Login succeeded
        '401':
          description: Invalid credentials
  /api/v1/auth/logout:
    post:
      summary: Invalidate the current token
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logout succeeded
        '401':
          description: Invalid token
  /api/v1/auth/me:
    get:
      summary: Return the current authenticated user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user payload
        '401':
          description: Invalid token
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
