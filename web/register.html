<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register · ChengetAi Learn</title>
  <link rel="stylesheet" href="static/css/style.css">
</head>
<body data-page="register">
  <main class="container auth-shell">
    <section class="card auth-card">
      <h1>Create account</h1>
      <form id="register-form" class="form-stack">
        <div>
          <p class="muted">Step 1: choose account type</p>
          <div class="role-grid">
            <label class="role-option"><input type="radio" name="role" value="learner" checked> Learner</label>
            <label class="role-option"><input type="radio" name="role" value="teacher"> Teacher</label>
            <label class="role-option"><input type="radio" name="role" value="parent"> Parent</label>
          </div>
        </div>

        <div>
          <p class="muted">Step 2: add account details</p>
          <label>First name
            <input type="text" name="first_name" required>
          </label>
          <label>Last name
            <input type="text" name="last_name" required>
          </label>
          <label>Email
            <input type="email" name="email" required>
          </label>
          <label>Phone
            <input type="tel" name="phone">
          </label>
          <label>Password
            <input type="password" name="password" minlength="8" required>
          </label>
        </div>

        <div id="learner-fields">
          <p class="muted">Learner details</p>
          <label>Education level
            <input type="text" name="education_level" placeholder="Primary, Secondary...">
          </label>
          <label>Grade
            <input type="text" name="grade" placeholder="Grade 7, Form 2...">
          </label>
          <label>Preferred language
            <input type="text" name="preferred_language" placeholder="en">
          </label>
        </div>

        <button class="button" type="submit">Register</button>
      </form>
      <p id="form-message" class="form-message"></p>
    </section>
  </main>
  <script src="static/js/app.js"></script>
</body>
</html>
