version: '3.8'

services:
  # Infrastructure Layer

  postgres:
    image: postgres:17-alpine
    container_name: chengetai-postgres
    environment:
      POSTGRES_DB: chengetai
      POSTGRES_USER: chengetai
      POSTGRES_PASSWORD: chengetai_dev_password_change_in_prod
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./platform/database/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chengetai"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chengetai

  redis:
    image: redis:7-alpine
    container_name: chengetai-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chengetai

  minio:
    image: minio/minio:latest
    container_name: chengetai-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/minio_data
    command: server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chengetai

  typesense:
    image: typesense/typesense:27-latest
    container_name: chengetai-typesense
    environment:
      TYPESENSE_API_KEY: xyz
      TYPESENSE_DATA_DIR: /data
    ports:
      - "8108:8108"
    volumes:
      - typesense_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8108/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chengetai

  nats:
    image: nats:2-latest
    container_name: chengetai-nats
    ports:
      - "4222:4222"
      - "8222:8222"
    command: -n chengetai-nats -m 8222
    healthcheck:
      test: ["CMD", "nats", "-s", "nats://localhost:4222", "server", "info"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chengetai

  # Monitoring Stack

  prometheus:
    image: prom/prometheus:latest
    container_name: chengetai-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - chengetai
    depends_on:
      - postgres
      - redis

  grafana:
    image: grafana/grafana:latest
    container_name: chengetai-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./docker/grafana/datasources:/etc/grafana/provisioning/datasources
    networks:
      - chengetai
    depends_on:
      - prometheus

  loki:
    image: grafana/loki:latest
    container_name: chengetai-loki
    ports:
      - "3100:3100"
    volumes:
      - ./docker/loki.yml:/etc/loki/local-config.yml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yml
    networks:
      - chengetai

  # Reverse Proxy

  caddy:
    image: caddy:latest
    container_name: chengetai-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - chengetai
    depends_on:
      - api-gateway

  # Platform Services

  api-gateway:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.service
      args:
        SERVICE_NAME: api-gateway
    container_name: chengetai-api-gateway
    environment:
      SERVICE_NAME: api-gateway
      SERVICE_PORT: 8000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: chengetai
      DB_USER: chengetai
      DB_PASSWORD: chengetai_dev_password_change_in_prod
      REDIS_URL: redis://redis:6379
      NATS_URL: nats://nats:4222
      LOG_LEVEL: debug
    ports:
      - "8000:8000"
    networks:
      - chengetai
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.service
      args:
        SERVICE_NAME: auth-service
    container_name: chengetai-auth-service
    environment:
      SERVICE_NAME: auth-service
      SERVICE_PORT: 8001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: chengetai
      DB_USER: chengetai
      DB_PASSWORD: chengetai_dev_password_change_in_prod
      REDIS_URL: redis://redis:6379
      NATS_URL: nats://nats:4222
      JWT_SECRET: dev_jwt_secret_change_in_prod
      LOG_LEVEL: debug
    ports:
      - "8001:8001"
    networks:
      - chengetai
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  user-service:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.service
      args:
        SERVICE_NAME: user-service
    container_name: chengetai-user-service
    environment:
      SERVICE_NAME: user-service
      SERVICE_PORT: 8002
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: chengetai
      DB_USER: chengetai
      DB_PASSWORD: chengetai_dev_password_change_in_prod
      REDIS_URL: redis://redis:6379
      NATS_URL: nats://nats:4222
      LOG_LEVEL: debug
    ports:
      - "8002:8002"
    networks:
      - chengetai
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  school-service:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.service
      args:
        SERVICE_NAME: school-service
    container_name: chengetai-school-service
    environment:
      SERVICE_NAME: school-service
      SERVICE_PORT: 8003
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: chengetai
      DB_USER: chengetai
      DB_PASSWORD: chengetai_dev_password_change_in_prod
      REDIS_URL: redis://redis:6379
      NATS_URL: nats://nats:4222
      LOG_LEVEL: debug
    ports:
      - "8003:8003"
    networks:
      - chengetai
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  wallet-service:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.service
      args:
        SERVICE_NAME: wallet-service
    container_name: chengetai-wallet-service
    environment:
      SERVICE_NAME: wallet-service
      SERVICE_PORT: 8004
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: chengetai
      DB_USER: chengetai
      DB_PASSWORD: chengetai_dev_password_change_in_prod
      REDIS_URL: redis://redis:6379
      NATS_URL: nats://nats:4222
      LOG_LEVEL: debug
    ports:
      - "8004:8004"
    networks:
      - chengetai
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  payment-service:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.service
      args:
        SERVICE_NAME: payment-service
    container_name: chengetai-payment-service
    environment:
      SERVICE_NAME: payment-service
      SERVICE_PORT: 8005
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: chengetai
      DB_USER: chengetai
      DB_PASSWORD: chengetai_dev_password_change_in_prod
      REDIS_URL: redis://redis:6379
      NATS_URL: nats://nats:4222
      LOG_LEVEL: debug
    ports:
      - "8005:8005"
    networks:
      - chengetai
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  notification-service:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.service
      args:
        SERVICE_NAME: notification-service
    container_name: chengetai-notification-service
    environment:
      SERVICE_NAME: notification-service
      SERVICE_PORT: 8006
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: chengetai
      DB_USER: chengetai
      DB_PASSWORD: chengetai_dev_password_change_in_prod
      REDIS_URL: redis://redis:6379
      NATS_URL: nats://nats:4222
      LOG_LEVEL: debug
    ports:
      - "8006:8006"
    networks:
      - chengetai
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8006/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  search-service:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.service
      args:
        SERVICE_NAME: search-service
    container_name: chengetai-search-service
    environment:
      SERVICE_NAME: search-service
      SERVICE_PORT: 8008
      TYPESENSE_HOST: typesense
      TYPESENSE_PORT: 8108
      TYPESENSE_API_KEY: xyz
      REDIS_URL: redis://redis:6379
      NATS_URL: nats://nats:4222
      LOG_LEVEL: debug
    ports:
      - "8008:8008"
    networks:
      - chengetai
    depends_on:
      typesense:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8008/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Intelligence Layer - Phase 3

  ai-service:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.service
      args:
        SERVICE_NAME: ai-service
    container_name: chengetai-ai-service
    environment:
      SERVICE_NAME: ai-service
      SERVICE_PORT: 8009
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: chengetai
      DB_USER: chengetai
      DB_PASSWORD: chengetai_dev_password_change_in_prod
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:-sk-test}
      CLAUDE_MODEL: claude-opus-5
      CLAUDE_MAX_TOKENS: 4096
      RAG_MAX_CONTEXT_LENGTH: 8192
      RAG_MIN_SIMILARITY: 0.5
      RAG_TOP_K: 5
      LOG_LEVEL: debug
    ports:
      - "8009:8009"
    networks:
      - chengetai
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8009/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  quiz-service:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.service
      args:
        SERVICE_NAME: quiz-service
    container_name: chengetai-quiz-service
    environment:
      SERVICE_NAME: quiz-service
      SERVICE_PORT: 8010
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: chengetai
      DB_USER: chengetai
      DB_PASSWORD: chengetai_dev_password_change_in_prod
      REDIS_URL: redis://redis:6379
      NATS_URL: nats://nats:4222
      DEFAULT_QUESTION_COUNT: 10
      DEFAULT_DIFFICULTY: medium
      LOG_LEVEL: debug
    ports:
      - "8010:8010"
    networks:
      - chengetai
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8010/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  recommendations-service:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.service
      args:
        SERVICE_NAME: recommendations-service
    container_name: chengetai-recommendations-service
    environment:
      SERVICE_NAME: recommendations-service
      SERVICE_PORT: 8011
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: chengetai
      DB_USER: chengetai
      DB_PASSWORD: chengetai_dev_password_change_in_prod
      REDIS_URL: redis://redis:6379
      NATS_URL: nats://nats:4222
      DEFAULT_TOP_K: 10
      DEFAULT_MIN_SIMILARITY: 0.5
      DEFAULT_STRATEGY: hybrid
      LOG_LEVEL: debug
    ports:
      - "8011:8011"
    networks:
      - chengetai
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8011/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Analytics & Reporting - Phase 4

  analytics-service:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.service
      args:
        SERVICE_NAME: analytics-service
    container_name: chengetai-analytics-service
    environment:
      SERVICE_NAME: analytics-service
      SERVICE_PORT: 8012
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: chengetai
      DB_USER: chengetai
      DB_PASSWORD: chengetai_dev_password_change_in_prod
      REDIS_URL: redis://redis:6379
      NATS_URL: nats://nats:4222
      ANALYTICS_RETENTION_DAYS: 90
      ANALYTICS_BATCH_SIZE: 100
      REPORT_GENERATION_TIME: "00:00"
      LOG_LEVEL: debug
    ports:
      - "8012:8012"
    networks:
      - chengetai
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8012/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  minio_data:
  typesense_data:
  prometheus_data:
  grafana_data:
  loki_data:
  caddy_data:
  caddy_config:

networks:
  chengetai:
    driver: bridge
