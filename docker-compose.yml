services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chengetai}
      POSTGRES_USER: ${POSTGRES_USER:-chengetai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chengetai}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - chengetai-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - chengetai-network

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL}
      REDIS_URL: redis://redis:6379
    depends_on:
      - postgres
      - redis
    ports:
      - "8080:8080"
    networks:
      - chengetai-network

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    depends_on:
      - api
    ports:
      - "8081:80"
    networks:
      - chengetai-network

networks:
  chengetai-network:
    driver: bridge

volumes:
  postgres_data:
