services:
  # Infrastructure Services

  postgres:
    type: pserv
    plan: standard
    ipAllowList: []
    region: ohio
    databaseName: chengetai
    user: chengetai
    preDeployCommand: "psql $DATABASE_URL -f platform/database/migrations/000_create_users_table.sql && psql $DATABASE_URL -f platform/database/migrations/001_create_resources_table.sql && psql $DATABASE_URL -f platform/database/migrations/002_create_schools_table.sql && psql $DATABASE_URL -f platform/database/migrations/003_create_resource_metadata.sql && psql $DATABASE_URL -f platform/database/migrations/004_create_user_preferences.sql && psql $DATABASE_URL -f platform/database/migrations/005_create_embeddings.sql && psql $DATABASE_URL -f platform/database/migrations/006_create_wallet_tables.sql && psql $DATABASE_URL -f platform/database/migrations/007_create_quizzes_table.sql && psql $DATABASE_URL -f platform/database/migrations/008_create_recommendations_table.sql && psql $DATABASE_URL -f platform/database/migrations/009_create_analytics_tables.sql"

  redis:
    type: redis
    plan: standard
    region: ohio
    ipAllowList: []

  # API Gateway (Entry Point)
  api-gateway:
    type: web
    name: chengetai-api-gateway
    runtime: docker
    plan: standard
    region: ohio
    dockerfilePath: ./docker/Dockerfile.service
    dockerContext: .
    buildArgs:
      - key: SERVICE_NAME
        value: api-gateway
    envVars:
      - key: SERVICE_NAME
        value: api-gateway
      - key: SERVICE_PORT
        value: "8000"
      - key: DB_HOST
        fromDatabase:
          name: postgres
          property: host
      - key: DB_PORT
        fromDatabase:
          name: postgres
          property: port
      - key: DB_NAME
        fromDatabase:
          name: postgres
          property: database
      - key: DB_USER
        fromDatabase:
          name: postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: postgres
          property: password
      - key: REDIS_URL
        fromService:
          name: redis
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: info
      - key: CORS_ALLOWED_ORIGINS
        value: https://your-domain.com
      - key: FORCE_HTTPS
        value: "true"
      - key: HSTS_ENABLED
        value: "true"
      - key: JWT_SECRET
        sync: false
    healthCheckPath: /health
    healthCheckTimeout: 10
    autoDeploy: false

  # Authentication Service
  auth-service:
    type: web
    name: chengetai-auth-service
    runtime: docker
    plan: standard
    region: ohio
    dockerfilePath: ./docker/Dockerfile.service
    dockerContext: .
    buildArgs:
      - key: SERVICE_NAME
        value: auth-service
    envVars:
      - key: SERVICE_NAME
        value: auth-service
      - key: SERVICE_PORT
        value: "8001"
      - key: DB_HOST
        fromDatabase:
          name: postgres
          property: host
      - key: DB_PORT
        fromDatabase:
          name: postgres
          property: port
      - key: DB_NAME
        fromDatabase:
          name: postgres
          property: database
      - key: DB_USER
        fromDatabase:
          name: postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: postgres
          property: password
      - key: REDIS_URL
        fromService:
          name: redis
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: ENVIRONMENT
        value: production
    healthCheckPath: /health
    healthCheckTimeout: 10
    autoDeploy: false

  # User Service
  user-service:
